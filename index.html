<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f8cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hábitos">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <title>Meus Hábitos</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #8a90a0;
      --line: #e6e9f0;
      --accent: #4f8cff;
      --accent-soft: #e8f0ff;
      --done: #34c77b;
      --danger: #ff5b6a;
      --radius: 16px;
      --shadow: 0 2px 12px rgba(31,36,48,0.06);
    }
    /* Paleta escura */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14171f; --card: #1e222c; --text: #e8eaf0; --muted: #868d9e;
        --line: #2c313d; --accent: #5b93ff; --accent-soft: #23304d;
        --shadow: 0 2px 12px rgba(0,0,0,0.35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #14171f; --card: #1e222c; --text: #e8eaf0; --muted: #868d9e;
      --line: #2c313d; --accent: #5b93ff; --accent-soft: #23304d;
      --shadow: 0 2px 12px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 560px;
      margin: 0 auto;
      padding: 0 16px 96px;
      min-height: 100vh;
    }
    header {
      padding: 24px 4px 12px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    h1 { font-size: 26px; margin: 0; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }

    /* Abas */
    .tabs {
      display: flex;
      gap: 6px;
      background: var(--card);
      padding: 5px;
      border-radius: 14px;
      margin-top: 16px;
      box-shadow: var(--shadow);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px 4px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all .15s;
    }
    .tab.active { background: var(--accent); color: #fff; }

    .view { display: none; padding-top: 16px; }
    .view.active { display: block; }

    /* Cartão de hábito */
    .habit {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      padding: 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .habit:active { background: var(--accent-soft); }
    .check {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 2px solid var(--line);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all .15s;
      background: transparent;
    }
    .check.done {
      background: var(--done);
      border-color: var(--done);
    }
    .check svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; transition: opacity .15s; }
    .check.done svg { opacity: 1; }
    .habit-info { flex: 1; min-width: 0; }
    .habit-name { font-weight: 600; font-size: 16px; }
    .habit-name.done { text-decoration: line-through; color: var(--muted); }
    .streak {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
      display: flex; align-items: center; gap: 4px;
    }
    .streak strong { color: var(--accent); }
    .time-tag { color: var(--done); font-weight: 600; }
    .icon-btn {
      background: transparent; border: none; cursor: pointer;
      color: var(--muted); font-size: 18px; padding: 6px;
      border-radius: 8px;
    }
    .icon-btn:active { background: var(--line); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 20px;
      font-size: 15px;
      line-height: 1.6;
    }
    .empty .big { font-size: 40px; margin-bottom: 8px; }

    /* Botão flutuante */
    .fab {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 15px 26px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(79,140,255,0.4);
      cursor: pointer;
      z-index: 20;
      display: flex; align-items: center; gap: 8px;
    }
    .fab:active { transform: translateX(-50%) scale(0.96); }

    /* Modal */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(31,36,48,0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 30;
    }
    .overlay.open { display: flex; }
    .sheet {
      background: var(--card);
      width: 100%;
      max-width: 560px;
      border-radius: 22px 22px 0 0;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      animation: slideUp .2s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet h2 { margin: 0 0 16px; font-size: 20px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    input[type=text] {
      width: 100%;
      padding: 14px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
    }
    input[type=text]:focus { outline: none; border-color: var(--accent); }
    .emoji-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .emoji-opt {
      width: 44px; height: 44px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: var(--bg);
      font-size: 22px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .emoji-opt.sel { border-color: var(--accent); background: var(--accent-soft); }
    .emoji-opt.none { color: var(--muted); font-size: 20px; }
    .btn-row { display: flex; gap: 10px; margin-top: 8px; }
    .btn {
      flex: 1; padding: 15px; border-radius: 12px; font-size: 16px;
      font-weight: 600; border: none; cursor: pointer; font-family: inherit;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--bg); color: var(--muted); }
    .btn-danger { background: transparent; color: var(--danger); }

    /* Calendário / Histórico */
    .cal-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 12px;
    }
    .cal-head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .cal-head .emoji { font-size: 22px; }
    .cal-head .name { font-weight: 600; flex: 1; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .cal-dow { font-size: 11px; color: var(--muted); text-align: center; font-weight: 600; }
    .cal-day {
      aspect-ratio: 1;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      background: var(--bg);
      color: var(--muted);
    }
    .cal-day.done { background: var(--done); color: #fff; font-weight: 600; }
    .cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
    .cal-day.blank { background: transparent; }
    .cal-day[data-date] { cursor: pointer; }
    .cal-day[data-date]:active { transform: scale(0.9); }
    .cal-month { text-align: center; font-weight: 600; font-size: 15px; margin-bottom: 12px; text-transform: capitalize; }
    .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .month-nav button { background: var(--card); border: none; font-size: 20px; padding: 6px 14px; border-radius: 10px; cursor: pointer; box-shadow: var(--shadow); color: var(--accent); }

    /* Detalhe do dia */
    .day-habit { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    .day-status {
      background: var(--bg);
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      margin-bottom: 18px;
    }
    .day-status.done { background: var(--accent-soft); }
    .day-status strong { color: var(--done); font-size: 18px; }
    .muted-note { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <h1>Meus Hábitos</h1>
      <button class="icon-btn" id="settingsBtn" aria-label="ajustes" style="font-size:22px;">⚙️</button>
    </div>
    <div class="subtitle" id="todayLabel"></div>
    <div class="tabs">
      <button class="tab active" data-view="today">Hoje</button>
      <button class="tab" data-view="history">Histórico</button>
    </div>
  </header>

  <!-- HOJE -->
  <section class="view active" id="view-today">
    <div id="habitList"></div>
  </section>

  <!-- HISTÓRICO -->
  <section class="view" id="view-history">
    <div class="month-nav">
      <button id="prevMonth">‹</button>
      <div class="cal-month" id="monthLabel"></div>
      <button id="nextMonth">›</button>
    </div>
    <div id="historyList"></div>
  </section>

  <button class="fab" id="addBtn">＋ Novo hábito</button>

  <!-- Modal criar/editar -->
  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2 id="sheetTitle">Novo hábito</h2>
      <div class="field">
        <label>Nome do hábito</label>
        <input type="text" id="habitInput" placeholder="Ex: Beber água, Ler, Exercício..." maxlength="40">
      </div>
      <div class="field">
        <label>Ícone</label>
        <div class="emoji-row" id="emojiRow"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Salvar</button>
      </div>
      <div class="btn-row" id="deleteRow" style="display:none;">
        <button class="btn btn-danger" id="deleteBtn">Apagar hábito</button>
      </div>
    </div>
  </div>

  <!-- Modal detalhe do dia (histórico) -->
  <div class="overlay" id="dayOverlay">
    <div class="sheet">
      <h2 id="dayTitle">Detalhe do dia</h2>
      <div id="dayDetail"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="dayClose">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Modal de ajustes -->
  <div class="overlay" id="settingsOverlay">
    <div class="sheet">
      <h2>Ajustes</h2>
      <div class="field">
        <label>Tema</label>
        <select id="themeSelect" style="width:100%; padding:14px; border:1.5px solid var(--line); border-radius:12px; font-size:16px; font-family:inherit; background:var(--bg); color:var(--text);">
          <option value="auto">Automático (segue o celular)</option>
          <option value="light">Claro</option>
          <option value="dark">Escuro</option>
        </select>
      </div>
      <div class="field">
        <label>Horário em que o dia vira</label>
        <div class="subtitle" style="margin:-2px 0 10px;">
          Os hábitos "zeram" nesse horário. Antes dele, o que você marcar conta como o dia anterior.
        </div>
        <select id="resetHourSelect" style="width:100%; padding:14px; border:1.5px solid var(--line); border-radius:12px; font-size:16px; font-family:inherit; background:var(--bg); color:var(--text);"></select>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="settingsCancel">Fechar</button>
        <button class="btn btn-primary" id="settingsSave">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    // ---------- Armazenamento (offline, no próprio celular) ----------
    const STORE_KEY = 'meus_habitos_v1';
    const EMOJIS = ['💊','💉','🩺','🩹','🧴','💧','📚','🏃','🧘','💪','🥗','😴','🚭','🦷','🧹','✍️','🎯','☀️','🌙','🎨','🎸'];

    let state = load();

    function load() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      return { habits: [], settings: { resetHour: 6 } };
    }
    function save() {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }
    // migração/segurança: garante que settings exista
    if (!state.settings) state.settings = { resetHour: 6 };
    if (typeof state.settings.resetHour !== 'number') state.settings.resetHour = 6;
    if (!state.settings.theme) state.settings.theme = 'auto';

    // ---------- Utilidades de data ----------
    // O "dia ativo" vira no horário de corte (padrão 6h). Antes disso,
    // ainda conta como o dia anterior — nada é apagado, só recalculado.
    function keyOf(d) {
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    function effectiveDate(real = new Date()) {
      // subtrai o horário de corte: às 5h59 volta pro dia anterior, às 6h vira o novo dia
      return new Date(real.getTime() - state.settings.resetHour * 3600 * 1000);
    }
    function todayKey() {
      return keyOf(effectiveDate());
    }
    // horário do relógio ao marcar (HH:MM)
    function nowTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
    // extrai o horário salvo (marcações antigas eram "true", sem horário)
    function markTime(v) {
      return (typeof v === 'string' && /^\d{2}:\d{2}$/.test(v)) ? v : null;
    }
    function calcStreak(habit) {
      // conta dias seguidos até hoje (ou ontem, se hoje ainda não marcado)
      let streak = 0;
      let d = effectiveDate();
      if (!habit.days[keyOf(d)]) {
        d.setDate(d.getDate() - 1); // permite manter streak se o dia ativo ainda não foi marcado
      }
      while (habit.days[keyOf(d)]) {
        streak++;
        d.setDate(d.getDate() - 1);
      }
      return streak;
    }

    // ---------- Renderização: Hoje ----------
    function renderToday() {
      const list = document.getElementById('habitList');
      const tk = todayKey();
      if (state.habits.length === 0) {
        list.innerHTML = '<div class="empty"><div class="big">🌱</div>Você ainda não tem hábitos.<br>Toque em <strong>+ Novo hábito</strong> para começar!</div>';
        return;
      }
      list.innerHTML = '';
      state.habits.forEach(h => {
        const done = !!h.days[tk];
        const time = markTime(h.days[tk]);
        const streak = calcStreak(h);
        const el = document.createElement('div');
        el.className = 'habit';
        el.setAttribute('data-toggle', h.id);
        const label = (h.emoji ? h.emoji + ' ' : '') + escapeHtml(h.name);
        const timeTag = (done && time) ? ` · <span class="time-tag">⏰ ${time}</span>` : '';
        el.innerHTML = `
          <span class="check ${done?'done':''}" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
          </span>
          <div class="habit-info">
            <div class="habit-name ${done?'done':''}">${label}</div>
            <div class="streak">🔥 <strong>${streak}</strong> ${streak===1?'dia':'dias'} seguidos${timeTag}</div>
          </div>
          <button class="icon-btn" data-edit="${h.id}" aria-label="editar">✏️</button>
        `;
        list.appendChild(el);
      });
    }

    // ---------- Renderização: Histórico ----------
    let viewMonth = new Date();
    viewMonth.setDate(1);

    function renderHistory() {
      const label = document.getElementById('monthLabel');
      label.textContent = viewMonth.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

      const wrap = document.getElementById('historyList');
      if (state.habits.length === 0) {
        wrap.innerHTML = '<div class="empty"><div class="big">📅</div>Sem histórico ainda.</div>';
        return;
      }
      wrap.innerHTML = '';
      const year = viewMonth.getFullYear();
      const month = viewMonth.getMonth();
      const firstDow = new Date(year, month, 1).getDay(); // 0=dom
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const dows = ['D','S','T','Q','Q','S','S'];
      const tk = todayKey();

      state.habits.forEach(h => {
        const card = document.createElement('div');
        card.className = 'cal-card';
        let cells = '';
        dows.forEach(d => cells += `<div class="cal-dow">${d}</div>`);
        for (let i=0; i<firstDow; i++) cells += '<div class="cal-day blank"></div>';
        for (let day=1; day<=daysInMonth; day++) {
          const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
          const done = !!h.days[key];
          const isToday = key === tk;
          cells += `<div class="cal-day ${done?'done':''} ${isToday?'today':''}" data-habit="${h.id}" data-date="${key}">${day}</div>`;
        }
        // total do mês
        let total = 0;
        for (let day=1; day<=daysInMonth; day++) {
          const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
          if (h.days[key]) total++;
        }
        card.innerHTML = `
          <div class="cal-head">
            ${h.emoji ? `<span class="emoji">${h.emoji}</span>` : ''}
            <span class="name">${escapeHtml(h.name)}</span>
            <span class="streak"><strong>${total}</strong>×</span>
          </div>
          <div class="cal-grid">${cells}</div>
        `;
        wrap.appendChild(card);
      });
    }

    // ---------- Interações ----------
    document.getElementById('habitList').addEventListener('click', e => {
      // o lápis (editar) tem prioridade e não marca o hábito
      const edit = e.target.closest('[data-edit]');
      if (edit) {
        openSheet(state.habits.find(x => x.id === edit.dataset.edit));
        return;
      }
      // clicar em qualquer outra parte do hábito marca/desmarca
      const toggle = e.target.closest('[data-toggle]');
      if (toggle) {
        const h = state.habits.find(x => x.id === toggle.dataset.toggle);
        const tk = todayKey();
        if (h.days[tk]) delete h.days[tk]; else h.days[tk] = nowTime();
        save(); renderToday();
      }
    });

    // Detalhe do dia no histórico (clicar num dia do calendário)
    document.getElementById('historyList').addEventListener('click', e => {
      const cell = e.target.closest('.cal-day[data-date]');
      if (cell) openDayDetail(cell.dataset.habit, cell.dataset.date);
    });
    function openDayDetail(habitId, key) {
      const h = state.habits.find(x => x.id === habitId);
      if (!h) return;
      const [y,m,dd] = key.split('-').map(Number);
      const label = new Date(y, m-1, dd).toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
      const val = h.days[key];
      const done = !!val;
      const time = markTime(val);
      const nome = (h.emoji ? h.emoji + ' ' : '') + escapeHtml(h.name);
      let status;
      if (done && time) status = `<div class="day-status done">✅ Marcado às <strong>${time}</strong></div>`;
      else if (done) status = `<div class="day-status done">✅ Marcado <span class="muted-note">(sem horário registrado)</span></div>`;
      else status = `<div class="day-status">⬜ Não foi marcado neste dia</div>`;
      document.getElementById('dayTitle').textContent = label.charAt(0).toUpperCase() + label.slice(1);
      document.getElementById('dayDetail').innerHTML = `<div class="day-habit">${nome}</div>${status}`;
      document.getElementById('dayOverlay').classList.add('open');
    }
    document.getElementById('dayClose').addEventListener('click', () =>
      document.getElementById('dayOverlay').classList.remove('open'));
    document.getElementById('dayOverlay').addEventListener('click', e => {
      if (e.target.id === 'dayOverlay') e.currentTarget.classList.remove('open');
    });

    // Abas
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        document.getElementById('view-' + t.dataset.view).classList.add('active');
        if (t.dataset.view === 'history') renderHistory();
      });
    });

    document.getElementById('prevMonth').addEventListener('click', () => {
      viewMonth.setMonth(viewMonth.getMonth() - 1); renderHistory();
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
      viewMonth.setMonth(viewMonth.getMonth() + 1); renderHistory();
    });

    // ---------- Modal ----------
    let editingId = null;
    let selectedEmoji = EMOJIS[0];

    function buildEmojiRow() {
      const row = document.getElementById('emojiRow');
      row.innerHTML = '';
      // opção "sem ícone" (emoji vazio)
      const none = document.createElement('button');
      none.className = 'emoji-opt none' + (selectedEmoji === '' ? ' sel' : '');
      none.textContent = '∅';
      none.title = 'Sem ícone';
      none.onclick = () => { selectedEmoji = ''; buildEmojiRow(); };
      row.appendChild(none);
      EMOJIS.forEach(em => {
        const b = document.createElement('button');
        b.className = 'emoji-opt' + (em === selectedEmoji ? ' sel' : '');
        b.textContent = em;
        b.onclick = () => { selectedEmoji = em; buildEmojiRow(); };
        row.appendChild(b);
      });
    }

    function openSheet(habit) {
      editingId = habit ? habit.id : null;
      document.getElementById('sheetTitle').textContent = habit ? 'Editar hábito' : 'Novo hábito';
      document.getElementById('habitInput').value = habit ? habit.name : '';
      selectedEmoji = habit ? habit.emoji : '💧';
      document.getElementById('deleteRow').style.display = habit ? 'flex' : 'none';
      buildEmojiRow();
      document.getElementById('overlay').classList.add('open');
      setTimeout(() => document.getElementById('habitInput').focus(), 100);
    }
    function closeSheet() {
      document.getElementById('overlay').classList.remove('open');
      editingId = null;
    }

    document.getElementById('addBtn').addEventListener('click', () => openSheet(null));
    document.getElementById('cancelBtn').addEventListener('click', closeSheet);
    document.getElementById('overlay').addEventListener('click', e => {
      if (e.target.id === 'overlay') closeSheet();
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      const name = document.getElementById('habitInput').value.trim();
      if (!name) { document.getElementById('habitInput').focus(); return; }
      if (editingId) {
        const h = state.habits.find(x => x.id === editingId);
        h.name = name; h.emoji = selectedEmoji;
      } else {
        state.habits.push({ id: 'h' + Date.now(), name, emoji: selectedEmoji, days: {} });
      }
      save(); closeSheet(); renderToday();
    });

    document.getElementById('deleteBtn').addEventListener('click', () => {
      if (!editingId) return;
      if (confirm('Apagar este hábito e todo o histórico dele?')) {
        state.habits = state.habits.filter(x => x.id !== editingId);
        save(); closeSheet(); renderToday();
      }
    });

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ---------- Ajustes ----------
    function buildHourOptions() {
      const sel = document.getElementById('resetHourSelect');
      sel.innerHTML = '';
      for (let h = 0; h < 24; h++) {
        const o = document.createElement('option');
        o.value = h;
        o.textContent = String(h).padStart(2,'0') + ':00';
        if (h === state.settings.resetHour) o.selected = true;
        sel.appendChild(o);
      }
    }
    function updateTodayLabel() {
      document.getElementById('todayLabel').textContent =
        effectiveDate().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    function applyTheme() {
      const t = state.settings.theme || 'auto';
      const root = document.documentElement;
      if (t === 'auto') root.removeAttribute('data-theme');
      else root.setAttribute('data-theme', t);
      const dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const meta = document.querySelector('meta[name=theme-color]');
      if (meta) meta.setAttribute('content', dark ? '#14171f' : '#4f8cff');
    }
    document.getElementById('settingsBtn').addEventListener('click', () => {
      buildHourOptions();
      document.getElementById('themeSelect').value = state.settings.theme || 'auto';
      document.getElementById('settingsOverlay').classList.add('open');
    });
    document.getElementById('settingsCancel').addEventListener('click', () => {
      document.getElementById('settingsOverlay').classList.remove('open');
    });
    document.getElementById('settingsOverlay').addEventListener('click', e => {
      if (e.target.id === 'settingsOverlay') e.currentTarget.classList.remove('open');
    });
    document.getElementById('settingsSave').addEventListener('click', () => {
      state.settings.resetHour = parseInt(document.getElementById('resetHourSelect').value, 10) || 0;
      state.settings.theme = document.getElementById('themeSelect').value;
      save();
      document.getElementById('settingsOverlay').classList.remove('open');
      applyTheme();
      updateTodayLabel();
      renderToday();
    });

    // ---------- Início ----------
    applyTheme();
    // se o tema for automático, acompanha mudanças do sistema em tempo real
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if ((state.settings.theme || 'auto') === 'auto') applyTheme();
    });
    updateTodayLabel();
    renderToday();

    // Registra o service worker (faz funcionar offline quando servido por https)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
